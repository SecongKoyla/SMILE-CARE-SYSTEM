spring.application.name=smilecare-backend

# ===============================
# = DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:6543/postgres
spring.datasource.username=postgres.rglshsvnzagoaviojkfm
spring.datasource.password=SecongKoyla
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# = JPA / HIBERNATE CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Fix Hibernate lazy loading issues
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false
spring.jpa.open-in-view=false

# Connection pooling
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ===============================
# = SERVER CONFIG
# ===============================
server.port=8085

# ===============================
# = JWT CONFIG
# ===============================
jwt.secret=SmileCareSecretKeyForJWTGeneration123456789
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# ===============================
# = LOGGING
# ===============================
logging.level.org.springframework.security=DEBUG
