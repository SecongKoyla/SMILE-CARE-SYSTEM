spring.application.name=smilecare-backend

# ===============================
# = DATABASE CONFIGURATION
# ===============================
# Added prepareThreshold=0 to fix Supabase Transaction Pooler prepared statement caching error
spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=postgres.rglshsvnzagoaviojkfm
spring.datasource.password=SecongKoyla
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# = JPA / HIBERNATE CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Fix Hibernate lazy loading issues
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false
spring.jpa.open-in-view=false

# Optimize Hibernate prepared statement caching for concurrent access
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.jdbc.use_scrollable_resultset=false
spring.jpa.properties.hibernate.generate_statistics=false

# Fix prepared statement conflict with PostgreSQL
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=0

# Connection pooling - optimized for concurrent bookings
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# ===============================
# = SERVER CONFIG
# ===============================
server.port=8085

# ===============================
# = JWT CONFIG
# ===============================
jwt.secret=SmileCareSecretKeyForJWTGeneration123456789
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# ===============================
# = LOGGING
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
